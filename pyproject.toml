[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-temporal-reasoning"
version = "1.0.0"
description = "AI-powered Video Understanding & Temporal Reasoning System (HNX26PSI02)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Video Reasoning Team" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "flake8>=6.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
